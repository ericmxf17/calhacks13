<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Explore a saved policy impact analysis for the fictional VoltRide company.">
  <title>Policy desk · VoltRide</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23253428'/%3E%3Cpath d='M9 22V10h7a4 4 0 0 1 0 8h-3' fill='none' stroke='%23d7eeab' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to analysis</a>
  <header class="masthead">
    <a class="brand" href="#overview" aria-label="Policy desk overview">
      <span class="brand-mark" aria-hidden="true">p<span></span></span>
      <span>policy desk<span class="brand-period">.</span></span>
    </a>
    <span class="masthead-divider" aria-hidden="true"></span>
    <span class="workspace-name">Company intelligence</span>
    <span class="company-chip"><span class="company-avatar" aria-hidden="true">V</span> VoltRide</span>
  </header>
  <div class="prototype-bar">
    <span><span class="prototype-dot" aria-hidden="true"></span> Design study <span class="prototype-caption">/ explore the information order</span></span>
    <div class="layout-switch" role="group" aria-label="Overview layout">
      <button type="button" data-layout="brief" aria-pressed="true">01 <span>Brief</span></button>
      <button type="button" data-layout="decision" aria-pressed="false">02 <span>Decision first</span></button>
    </div>
  </div>
  <main id="main" tabindex="-1">
    <div class="loading" role="status">Opening the saved analysis…</div>
  </main>
  <footer class="site-footer">
    <span>Fictional company. Saved analysis, not live bill data.</span>
    <span>CalHacks ’26</span>
  </footer>
  <noscript>This prototype needs JavaScript to display its saved analysis.</noscript>
</body>
</html>
